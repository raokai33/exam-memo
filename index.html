<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>高级工背题</title>
  <meta name="theme-color" content="#2f6df0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="背题">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script>
    // R31 / R32 首帧套用（设计档 §2.19 A）：在样式表之前定档，防「先小后跳」。
    // 仅当存在合法的用户选择（localStorage['exam-memo-font'] = '0'/'1'/'2'）才写 data-font；
    // 无选择时不写 —— 根字号走基准档（宽屏的默认「大」由 CSS 媒体查询给出）。
    (function () {
      try {
        var level = window.localStorage.getItem('exam-memo-font');
        if (level === '0' || level === '1' || level === '2') {
          document.documentElement.setAttribute('data-font', level);
        }
      } catch (err) { /* 存储不可用：保持基准档，不阻断页面 */ }
    }());
  </script>
  <link rel="stylesheet" href="style.css?v=1.8.1">
</head>
<body>
  <div id="diag" hidden></div>
  <main id="root"></main>
  <script src="app.js?v=1.8.1"></script>
  <script>
    (function () {
      var root = document.getElementById('root');
      if (root && window.EXAM_MEMO && window.EXAM_MEMO.mount) {
        window.EXAM_MEMO.mount(root, {});
      }
    }());
  </script>
</body>
</html>
